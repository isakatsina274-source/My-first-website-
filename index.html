<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">

        <h1 class="title">Welcome to Isa's Website</h1>
        
          <h2>TEST — Product Search</h2>

        <p>
            I am learning frontend development
            and building my first website.
        </p>
        
        <button id="contactButton">Contact Me</button>

      <p id="apiData"></p>
        
      <p id="productName"></p>
      <p id="productPrice"></p>
      <p id="productStock"></p>

        <p id="productDescription"></p>
        
  <img id="productImage" alt="Product image">

        <h2>Search Products</h2>

<input
    type="text"
    id="searchInput"
    placeholder="Search for a product"
>

<button id="searchButton">Search</button>

<div id="searchResults"></div>
        
        <h2>Place an Order</h2>

<form id="orderForm">

<input
    type="text"
    id="customerName"
    placeholder="Your name"
    required
>

<input
    type="tel"
    id="customerPhone"
    placeholder="Phone number"
    required
>
    
    <input
        type="text"
        id="orderProduct"
        placeholder="Product name"
        required
    >

    <input
        type="number"
        id="orderQuantity"
        placeholder="Quantity"
        required
    >
<input
    type="number"
    id="orderPrice"
    placeholder="Price per unit"
    required
>

<p id="orderTotal">Total: ₦0</p>
    
    <button type="submit">Send Order</button>

</form>

<p id="orderResult"></p>
        
    </div>
<script src="script.js"></script>
</body>

</html>
