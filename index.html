<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">

        <h1 class="title">Welcome to Isa's Website</h1>
        <h2 class="subtitle">My First Project</h2>
        <p>
            I am learning frontend development
            and building my first website.
        </p>
        
        <button id="contactButton">Contact Me</button>

      <p id="apiData"></p>
        
      <p id="productName"></p>
      <p id="productPrice"></p>
      <p id="productStock"></p>

        <p id="productDescription"></p>
        
  <img id="productImage" alt="Product image">

        <h2>Place an Order</h2>

<form id="orderForm">

    <input
        type="text"
        id="orderProduct"
        placeholder="Product name"
        required
    >

    <input
        type="number"
        id="orderQuantity"
        placeholder="Quantity"
        required
    >

    <button type="submit">Send Order</button>

</form>

<p id="orderResult"></p>
        
    </div>
<script src="script.js"></script>
</body>

</html>
